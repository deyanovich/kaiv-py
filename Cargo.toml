[package]
name = "kaiv-py"
# The bindings version IS the PyPI version (maturin reads it);
# aligned with the kaiv core it wraps, starting at 0.10.0.
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/kaiv-format/kaiv-py"
description = "Python bindings for the kaiv format: the full pipeline, validation, schema inference, and the format hub"
homepage = "https://kaiv.io/"

[lib]
name = "kaiv"
crate-type = ["cdylib"]

[dependencies]
# The published core — the same crate the CLI and wasm wrap.
# Default features (ICU collation) plus the format hub; `net`
# stays off — resolution is offline + preload, like the wasm.
kaiv = { version = "0.13.0", features = [
  "json", "yaml", "toml", "xml", "cbor", "avro", "proto", "asn1",
  "graphql", "xsd",
] }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
